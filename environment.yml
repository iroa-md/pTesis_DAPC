# Entorno del análisis · tesis dolor agudo postcesárea (FONIS SA21I0036)
#
#   conda env create -f environment.yml
#   conda activate DAPC
#
# Declara las dependencias directas con su versión exacta, que son las que reporta el
# manuscrito. Las transitivas las resuelve conda. Para una réplica bit a bit del entorno
# original, `conda env export` produce el volcado completo con builds, que es específico
# de la plataforma y por eso no se publica aquí.
name: DAPC

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10.16

  # Manejo de datos
  - pandas=2.2.3
  - numpy=2.2.4
  - openpyxl=3.1.5          # lectura del catálogo y del diccionario de variables

  # Estadística
  - scipy=1.15.2            # pruebas de hipótesis del análisis bivariado
  - statsmodels=0.14.4      # regresión logística, ordinal y lineal robusta

  # Modelamiento predictivo
  - scikit-learn=1.6.1
  - shap=0.47.2

  # Figuras
  - matplotlib=3.10.0
  - seaborn=0.13.2          # parte del entorno original; los módulos de utils/ usan solo matplotlib

  # Cuadernos
  - jupyter=1.1.1
  - ipykernel=6.29.5

  - pip
  - pip:
      - xgboost==3.2.0
      - pyarrow==23.0.1     # lectura y escritura de parquet
      - python-docx==1.2.0  # emisión de las tablas en .docx
